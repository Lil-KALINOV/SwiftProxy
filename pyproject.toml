[build-system]

requires = ["hatchling>=1.25.0"]

build-backend = "hatchling.build"



[project]

name = "swift-proxy"

dynamic=["version"]



description = "SwiftProxy — local MTProto-WebSocket bridge proxy for Telegram Desktop"

readme = "docs/README.md"

requires-python = ">=3.8"



license = { name = "MIT", file = "LICENSE" }



authors = [

    { name = "LilKALINOV" }

]



keywords = [

    "telegram",

    "tdesktop",

    "proxy",

    "bypass",

    "websocket",

    "mtproto",

    "swiftproxy",

]

classifiers = [

  "Development Status :: 5 - Production/Stable",

  "Environment :: Console",

  "Intended Audience :: Customer Service",

  "Programming Language :: Python :: 3",

  "License :: OSI Approved :: MIT License",

  "Operating System :: OS Independent",

  "Topic :: System :: Networking :: Firewalls",

]



dependencies = [

    "pyperclip==1.9.0",

    "certifi",



    "psutil==5.9.8; platform_system == 'Windows' and python_version < '3.9'",

    "cryptography==41.0.7; platform_system == 'Windows' and python_version < '3.9'",

    "Pillow==10.4.0; platform_system == 'Windows' and python_version < '3.9'",



    "psutil==7.0.0; platform_system != 'Windows' or python_version >= '3.9'",

    "cryptography==46.0.5; platform_system != 'Windows' or python_version >= '3.9'",

    "Pillow==12.1.1; (platform_system != 'Windows' or python_version >= '3.9') and platform_system != 'Darwin'",

"PySide6>=6.6.0; python_version >= '3.9'",



    "pystray==0.19.5",

    "pyobjc-framework-Cocoa>=9.0; platform_system == 'Darwin'",

    "Pillow==12.1.0; platform_system == 'Darwin'",

]



[project.scripts]

swift-proxy = "proxy.tg_ws_proxy:main"

swift-proxy-tray-win = "windows:main"

swift-proxy-tray-macos = "macos:main"

swift-proxy-tray-linux = "linux:main"



[project.urls]

Source = "https://github.com/Lil-KALINOV/SwiftProxy"

Issues = "https://github.com/Lil-KALINOV/SwiftProxy/issues"



[tool.hatch.build.targets.wheel]

packages = ["proxy", "ui", "utils"]



[tool.hatch.build.force-include]

"windows.py" = "windows.py"

"macos.py" = "macos.py"

"linux.py" = "linux.py"



[tool.hatch.version]

path = "proxy/__init__.py"



[tool.ruff]

target-version = "py38"



[tool.ruff.lint]

select = ["E4", "E7", "E9", "F", "B", "C4"]

ignore = ["F403", "F405", "B023"]



[tool.ruff.lint.per-file-ignores]

"macos.py" = ["E402"]

